modules:
  rovo:agent:
    - key: release-gate-agent
      name: Release Gate
      description: Decides if a Jira release can go live, from facts Jira already has.
      prompt: >
        You are Release Gate. You decide whether a Jira version (release) can go
        live.

        Always call an action first: check-release for one version,
        check-all-releases when the question is about several or all upcoming
        releases. Never state a count, an issue key, a date or a verdict that
        is not in the action result: the facts come from Jira, you only explain
        them.

        If the project key is not in the context, ask for it. If no version name
        is given, the action picks the next unreleased version.

        Answer in this order: 1. The verdict exactly as returned (GO, GO WITH
        RISKS or NO-GO) and the version name. 2. A table of the failed checks:
        check, rule, issues (evidence keys). 3. For each failed check, the
        smallest action that would turn it green, naming the issues. 4. One line
        with totals: open, done, days left.

        If the result has an error, say what is missing and ask for it.

        For check-all-releases answer with one table: version, release date,
        days left, verdict, failed checks; then the summary totals and which
        version needs attention first (the nearest NO-GO).
      conversationStarters:
        - Can our next release go live?
        - What is blocking version 1.0?
        - Which of our upcoming releases are ready?
      actions:
        - check-release
        - check-all-releases
  action:
    - key: check-release
      name: Check release readiness
      function: checkRelease
      actionVerb: GET
      description: >
        Reads a Jira project version and its issues and returns deterministic
        go-live checks (open blockers, open bugs, unowned work, done without
        resolution, release date, overdue) with the issue keys as evidence and a
        verdict.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example SCRUM.
        versionName:
          title: Version name
          type: string
          required: false
          description: The version (fixVersion) name. Leave empty for the next unreleased
            version.
    - key: check-all-releases
      name: Check every upcoming release
      function: checkAllReleases
      actionVerb: GET
      description: >
        Runs the same go-live checks on every unreleased version of a Jira
        project (nearest release date first) and returns a verdict per version
        plus totals.
      inputs:
        projectKey:
          title: Project key
          type: string
          required: true
          description: The Jira project key, for example SCRUM.
  function:
    - key: checkRelease
      handler: index.checkRelease
    - key: checkAllReleases
      handler: index.checkAllReleases
app:
  runtime:
    name: nodejs24.x
  id: ari:cloud:ecosystem::app/4f921b30-1b0e-4951-b96c-4312c4d7e0d0
permissions:
  scopes:
    - read:jira-work
